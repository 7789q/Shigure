name: Build portable package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Windows x64 package
        shell: pwsh
        run: |
          dotnet publish .\Shigure.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -o .\artifacts\publish

      - name: Verify and archive package
        shell: pwsh
        run: |
          $required = @(
            '.\artifacts\publish\Shigure.exe',
            '.\artifacts\publish\Fuyutsui',
            '.\artifacts\publish\config',
            '.\artifacts\publish\keymap',
            '.\artifacts\publish\wow_process.txt'
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing required package item: $path"
            }
          }

          Compress-Archive `
            -Path .\artifacts\publish\* `
            -DestinationPath .\artifacts\Shigure-win-x64.zip

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: Shigure-win-x64
          path: artifacts/Shigure-win-x64.zip
          if-no-files-found: error
          compression-level: 0
